<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"Shelf & Page"</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="mainText">Библиотека</h1>
<form action="" class="libraryForm">
    <input type="text" id="title" placeholder='Введите название книги(например, "Три поросенка")' required>
    <input type="text" id="author" placeholder="Введите автора книги(например, Лев Толстой)" required>
    <input type="text" id="genre" placeholder="Введите жанр книги(например, Драма)" required>
    <input type="text" id="pages" placeholder="Введите количество страниц"required>
    <input type="checkbox" id="status">
    <button id="submit">Создать книгу</button>
</form>

<div id="books-container"></div>

<script src="script.js"></script>
</body>
</html>
